version: "v0.4"

project:
  name: Iwasawa modules
  description: >-
    Generic pseudo-null and directional pseudo-isomorphism calculus and the
    RingCat finite-quotient completed group algebra, topology, Hausdorffness,
    compactness and compact-route canonical-uniformity completeness.
  authors:
    - Formal Frontier Agents
  responsible_maintainers:
    - Beacon
  license: Apache-2.0

sources:
  - title: Original Formal Frontier bridge definitions and proofs for Iwasawa modules
    authors:
      - Beacon
    contributors:
      - name: Formal Frontier Agents
        role: Separate contribution of public client tests, configuration, metadata and documentation
      - name: Formal Frontier Agents
        role: Distinct contribution of native API reference, original catalogue descriptions and adapted generator/tests
    id: FormalFrontier/iwasawa-modules original mathematical Lean bridges
    type: original-proof
    relationship: independently-proves
    location: IwasawaModules/PseudoIsomorphism and IwasawaModules/CompletedGroupAlgebra
    note: >-
      Beacon's original Lean bridge proofs assemble imported mathlib APIs;
      subsequent original project contributions include native modules, public
      test clients, lint cleanup and coefficientwise clients with no index-group
      assumption. The positional-argument change is documented in the README.
      No excerpts from mathematical reference texts ship here, and this entry
      makes no source-coverage claim.
    license: Apache-2.0
    author_endorsement: participated
  - title: mathlib4
    authors:
      - Lean community contributors
    id: https://github.com/leanprover-community/mathlib4/tree/e37d88a26f3791ed5a93daa1f949af1021b8d103
    type: software library
    relationship: background
    note: >-
      Imported APIs for support, localization, ideal height, inverse limits,
      monoid algebras and topology; dependency, not vendored source or an
      original project authorship claim.
    license: Apache-2.0
    author_endorsement: n/a
  - title: Cohomology of Number Fields
    authors:
      - Jürgen Neukirch
      - Alexander Schmidt
      - Kay Wingberg
    type: book
    location: Chapter V, sections 1, 3 and 5
    relationship: background
    note: >-
      Mathematical motivation for the planned wider theory only; no book
      proof, text, asset or source-specific correspondence is included here.
    author_endorsement: not-contacted

related_formalizations:
  - id: https://github.com/leanprover-community/mathlib4/tree/e37d88a26f3791ed5a93daa1f949af1021b8d103
    relationship: builds-on
    note: Pinned upstream support/localization, limits, group algebra and topology APIs.

classification:
  arxiv: [math.NT, math.AC]

status:
  scope: >-
    Reusable generic foundation only, not the full Iwasawa-module roadmap or
    a source-formalization completion claim. The native API catalogue is bound
    to the unchanged mathematical and dependency inputs identified by
    deceb449133f8bcc7fb4829e4fc167b483eef3a2, not to this document's
    release status. Independent review and required build/standard-axiom
    evidence are tied to exact candidates in the separate release record.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Classical.choice, Quot.sound]
  main_results:
    - declaration: Module.isPseudoNull_iff_localizedModule_subsingleton
      file: IwasawaModules/PseudoIsomorphism/Basic.lean
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]
    - declaration: LinearMap.isPseudoIsomorphism_iff_localizedModule_map_bijective
      file: IwasawaModules/PseudoIsomorphism/LinearMap.lean
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]
    - declaration: CompletedGroupAlgebra.proj_ofMonoidAlgebra
      file: IwasawaModules/CompletedGroupAlgebra/Basic.lean
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]
    - declaration: CompletedGroupAlgebra.continuous_iff_proj
      file: IwasawaModules/CompletedGroupAlgebra/Topology.lean
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]

automation:
  methods:
    - method: agent
      framework: AI-assisted Lean authoring with pinned Lake and mathlib
      tool_setup: >-
        Beacon's original bridges, native-module and lint contributions;
        independently contributed public clients and metadata. The default
        build checks production and test roots with pinned Lean/mathlib.
        Separately retained native doc-gen4 SQLite/raw-record runs supplied
        the eleven-module API catalogue, not a private-proof census.
      prompting_notes: >-
        AI agents assisted with original construction, proof search, module
        migration, testing and documentation. Human/operator authorization
        for verified original project contributions does not assign copyright
        ownership or clear third-party reuse.
  notes: >-
    Mathematical and module/test contributions received independent review.
    The adapted native-documentation generator draws on the finite-group Tate
    cohomology, polynomial-root-stability and Anchor ideal-completion adapters;
    expression credit and the bounds of public API documentation are explained
    in docs/README.md. Exact release decisions are recorded separately.

fidelity:
  divergences: >-
    General arbitrary-commutative-ring statements replace narrower arithmetic
    motivation. No source coverage or full formalization equivalence is
    asserted. Later symmetry/reversal, growth and adjoints remain open.

review:
  status: independently reviewed published foundation; successor candidates require exact review
  reviewers:
    - Prism, Atlas, Lattice and Anchor (historical individual mathematical contributions)
    - Independent Formal Frontier reviewers (development and published-release candidates)
  notes: >-
    Prism, Atlas, Lattice and Anchor reviewed earlier original mathematical
    contributions. Separate independent reviews addressed the original
    development and subsequent published snapshots. Each successor requires
    its own exact-candidate review and applicable build and complete transitive
    standard-axiom evidence, including private and generated declarations.
    Schema validity or public API documentation alone is not acceptance.

acknowledgements: >-
  Beacon contributed original mathematical Lean bridges, native modules, lint
  and client improvements; other Formal Frontier contributors separately supplied
  public clients/metadata and the native API catalogue/adapter. Prism, Atlas,
  Lattice and Anchor reviewed individual earlier mathematical contributions;
  independent reviewers assessed later candidates. AI agents assisted authoring.
  Upstream mathlib authors retain credit for imported APIs. Contributor and
  reviewer roles do not assert copyright ownership.
