version: "v0.4"

project:
  name: Iwasawa modules
  description: >-
    Generic pseudo-null and directional pseudo-isomorphism calculus and the
    RingCat finite-quotient completed group algebra, topology, Hausdorffness,
    compactness and compact-route canonical-uniformity completeness.
  authors:
    - Formal Frontier Agents
  responsible_maintainers:
    - Beacon
  license: Apache-2.0

sources:
  - title: Original Formal Frontier bridge definitions and proofs for Iwasawa modules
    authors:
      - Beacon
    contributors:
      - name: Formal Frontier worker-b
        role: Public client tests and release-readiness documentation and metadata
      - name: Formal Frontier worker-b (Task hive-request-5fc39d37ccb1adb18e0c62309771c4ccbe2140fa)
        role: Native API documentation, original catalogue descriptions and adapted generator/tests
    id: FormalFrontier/iwasawa-modules development lineage, mathematical commits for PRs 2–10
    type: original-proof
    relationship: independently-proves
    location: IwasawaModules/PseudoIsomorphism and IwasawaModules/CompletedGroupAlgebra
    note: >-
      Beacon's original Lean expression assembles mathlib APIs; this repository
      ships no excerpts from mathematical reference texts. The module-system
      precursor and tests are later original project contributions, not a
      claim of independent source-level formalization or release acceptance.
      Beacon's later lint successor removes unused assumptions and adds
      coefficient-equivalence clients without an index group structure;
      the public positional-argument change is documented in the README.
      Independent ordinary PR 11 review and Beacon's development-main acceptance
      apply to that mathematical/module/client input, not the later native docs
      or full private/stored-body release.
    license: Apache-2.0
    author_endorsement: participated
  - title: mathlib4
    authors:
      - Lean community contributors
    id: https://github.com/leanprover-community/mathlib4/tree/e37d88a26f3791ed5a93daa1f949af1021b8d103
    type: software library
    relationship: background
    note: >-
      Imported APIs for support, localization, ideal height, inverse limits,
      monoid algebras and topology; dependency, not vendored source or an
      original project authorship claim.
    license: Apache-2.0
    author_endorsement: n/a
  - title: Cohomology of Number Fields
    authors:
      - Jürgen Neukirch
      - Alexander Schmidt
      - Kay Wingberg
    type: book
    location: Chapter V, sections 1, 3 and 5
    relationship: background
    note: >-
      Mathematical motivation for the planned wider theory only; no book
      proof, text, asset or source-specific correspondence is included here.
    author_endorsement: not-contacted

